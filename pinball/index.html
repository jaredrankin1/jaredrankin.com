<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0710">
<title>Weird Planet Pinball</title>
<meta name="description" content="Weird Planet, a playable pinball table by Jared Rankin. Collect five relics to unlock the Citadel.">
<link rel="preload" href="field.webp" as="image">
<link rel="preload" href="vt323.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"VT323";src:url(vt323.woff2) format("woff2");font-display:block}
:root{--bg:#0b0710;--fg:#f3e6cf;--dim:#9b8aa8;--amber:#ff8a1c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  background:radial-gradient(120% 80% at 50% 0%,#24123a 0%,var(--bg) 60%)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#cab{display:flex;flex-direction:column;gap:6px}
#bar{display:flex;align-items:center;justify-content:space-between;height:24px;font-size:13px;letter-spacing:.02em}
#bar a,#bar button{color:var(--dim);text-decoration:none;background:none;border:0;font:inherit;padding:4px 2px;cursor:pointer}
#bar a:hover,#bar button:hover{color:var(--fg)}
#dmd{display:block;border-radius:6px;background:#140904;box-shadow:inset 0 0 0 1px #2a160a,0 0 0 3px #05030a;
  filter:drop-shadow(0 0 3px rgba(255,138,28,.5))}
#pf{display:block;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 3px #05030a}
</style>
</head>
<body>
<div id="wrap">
  <div id="cab">
    <div id="bar" data-ui>
      <a href="/" data-ui>&larr; jaredrankin.com</a>
      <button id="mute" type="button" data-ui aria-label="Sound on">Sound on</button>
    </div>
    <canvas id="dmd" aria-label="Score display"></canvas>
    <canvas id="pf" aria-label="Weird Planet pinball table. Tap the left or right half of the screen to flip; hold the right half to pull the plunger."></canvas>
  </div>
</div>
<script>
(()=>{
'use strict';
/* ---------- constants ---------- */
const W=1024,H=1536,R=19,RV=22,G=1350,HSTEP=1/960,VMAX=4800;
const DEBUG=/debug/.test(location.search);
const $=s=>document.querySelector(s);
const pf=$('#pf'),ctx=pf.getContext('2d'),dmd=$('#dmd'),dctx=dmd.getContext('2d');
const field=new Image(),spr=new Image();
field.src='field.webp';spr.src='sprites.webp';
const SP={logo:[0,0,525,282],flipL:[527,0,235,143],flipR:[764,0,240,143],target:[0,284,82,174],roll:[84,284,114,148]};
let now=0;

/* ---------- geometry (playfield image pixels) ---------- */
const segs=[],circs=[],sensors=[];
function S(ax,ay,bx,by,o){o=o||{};const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);if(L<.5)return null;
  const s={ax,ay,bx,by,dx,dy,L2:dx*dx+dy*dy,nx:dy/L,ny:-dx/L,r:o.r??3,e:o.e??0.3,kind:o.kind||'wall',id:o.id,one:!!o.one,t:-9};
  segs.push(s);return s}
function PL(p,o){for(let i=0;i<p.length-2;i+=2)S(p[i],p[i+1],p[i+2],p[i+3],o)}
function C(x,y,r,o){o=o||{};const c={x,y,r,e:o.e??0.7,kind:o.kind||'post',id:o.id,t:-9};circs.push(c);return c}
function SN(x0,y0,x1,y1,id){sensors.push({x0,y0,x1,y1,id})}

// outer arch: ellipse through (48,300) and (1006,300)
const ACX=530,ACY=300,AA=482,AB=272,arch=[];
for(let k=0;k<=44;k++){const th=Math.PI+Math.PI*k/44;arch.push(ACX+AA*Math.cos(th),ACY+AB*Math.sin(th))}
PL(arch,{e:.25});
S(48,300,48,1218,{e:.3});             // left wall
S(1012,300,1012,1500,{e:.2});         // shooter outer wall
S(962,330,962,1500,{e:.3});           // right wall / shooter divider
S(962,330,1012,300,{one:true,e:.2});  // one-way gate at top of shooter lane
// orbit rails
function rail(a,b,xEnd,left){const p=[],tEnd=Math.acos((xEnd-ACX)/a);// angle in [0,pi] for cos
  const thS=left?Math.PI:2*Math.PI,thE=left?2*Math.PI-tEnd:2*Math.PI-tEnd;
  for(let k=0;k<=16;k++){const th=thS+(thE-thS)*k/16;p.push(ACX+a*Math.cos(th),ACY+b*Math.sin(th))}return p}
PL([100,420,100,300].concat(rail(427,220,270,true)),{r:4,e:.3});
PL([910,430,910,300].concat(rail(383,220,755,false)),{r:4,e:.3});
// RELICS island (left) with three stand-up targets on its face
function face(ax,ay,bx,by,ts,half,kind,base){
  let prev=0;const pts=[];
  ts.forEach((t,i)=>{const t0=t-half,t1=t+half;
    S(ax+(bx-ax)*prev,ay+(by-ay)*prev,ax+(bx-ax)*t0,ay+(by-ay)*t0,{r:4,e:.3});
    S(ax+(bx-ax)*t0,ay+(by-ay)*t0,ax+(bx-ax)*t1,ay+(by-ay)*t1,{r:5,e:.45,kind,id:base+i});prev=t1});
  S(ax+(bx-ax)*prev,ay+(by-ay)*prev,bx,by,{r:4,e:.3});
}
PL([48,480,124,500],{r:4});face(124,500,162,695,[.21,.47,.735],.09,'relic',0);PL([162,695,64,772,48,772],{r:4});
// ALIENS island (right) with two targets
PL([962,500,888,556],{r:4});face(888,556,852,708,[.45,.78],.1,'alien',0);PL([852,708,950,775,962,775],{r:4});
// relic scoop (left inner lane)
S(196,385,205,575,{r:4,e:.25});S(262,398,290,568,{r:4,e:.25});S(196,385,262,398,{r:4,e:.1});
C(205,575,9,{e:.6});C(290,568,9,{e:.6});
// citadel block: only its bottom face is live
PL([420,250,420,200,325,252],{r:4,e:.3});PL([420,200,512,150,610,200],{r:4,e:.3});PL([610,250,610,200,700,250],{r:4,e:.3});
S(420,250,610,250,{r:4,e:.35,kind:'citadel'});
// bumpers and posts
const bumpers=[C(373,292,50,{kind:'bumper',id:0,e:.5}),C(650,288,50,{kind:'bumper',id:1,e:.5}),C(510,396,50,{kind:'bumper',id:2,e:.5})];
C(512,290,10);C(377,421,11);C(642,421,11);
// slingshots
const SLL=[110,993,100,1180,200,1245],SLR=[912,1000,907,1180,822,1244];
function sling(p,id){S(p[0],p[1],p[4],p[5],{r:6,e:.5,kind:'sling',id});S(p[0],p[1],p[2],p[3],{r:5});S(p[2],p[3],p[4],p[5],{r:5});
  C(p[0],p[1],10);C(p[2],p[3],10);C(p[4],p[5],10)}
sling(SLL,0);sling(SLR,1);
// inlane guides and apron
S(48,1218,234,1328,{r:4});S(962,1218,790,1328,{r:4});
S(230,1405,400,1536,{r:4});S(794,1405,624,1536,{r:4});
// plunger (moves)
const plg={y:1472,pull:0,charging:false,t0:0,snap:0};
const plSeg=S(962,1472,1012,1472,{r:2,e:.05,kind:'plunger',one:true});
// sensors
SN(48,330,100,400,'consp');SN(910,330,962,400,'sorc');
SN(200,392,262,440,'scoop');SN(50,1040,98,1090,'retL');SN(912,1040,960,1090,'retR');

/* ---------- flippers ---------- */
const FL=200,FR0=33,FR1=23,UP=22,DN=16;
function mkF(px,py,rest,up,dir){return{px,py,rest,up,ang:rest,w:0,dir,on:false}}
const fL=mkF(236,1370,0.576,-0.384,-1),fR=mkF(788,1370,Math.PI-0.576,Math.PI+0.384,1);
const flips=[fL,fR];
function stepFlip(f,h){const tg=f.on?f.up:f.rest,sp=f.on?UP:DN,d=tg-f.ang,st=sp*h;
  if(Math.abs(d)<=st){f.ang=tg;f.w=0}else{f.ang+=Math.sign(d)*st;f.w=Math.sign(d)*sp}}

/* ---------- balls ---------- */
const balls=[];
function mkBall(x,y){const b={x,y,vx:0,vy:0,M:[1,0,0,0,1,0,0,0,1],st:'play',hold:0,sens:{},still:0,trail:[]};
  // random initial orientation so scuffs differ
  rot(b,Math.random()*6,Math.random()*6,Math.random()*6,1);balls.push(b);return b}
function rot(b,wx,wy,wz,dt){const w=Math.hypot(wx,wy,wz);if(w<1e-6)return;const a=w*dt,x=wx/w,y=wy/w,z=wz/w,c=Math.cos(a),s=Math.sin(a),t=1-c;
  const r=[t*x*x+c,t*x*y-s*z,t*x*z+s*y,t*x*y+s*z,t*y*y+c,t*y*z-s*x,t*x*z-s*y,t*y*z+s*x,t*z*z+c],m=b.M,o=new Array(9);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)o[i*3+j]=r[i*3]*m[j]+r[i*3+1]*m[3+j]+r[i*3+2]*m[6+j];b.M=o}
const MARKS=[];{for(let i=0;i<14;i++){const u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u);MARKS.push([s*Math.cos(a),s*Math.sin(a),u,.12+Math.random()*.16])}}

/* ---------- collisions ---------- */
function bounce(b,nx,ny,e,obj,sx,sy){
  // sx,sy = surface velocity
  const rvx=b.vx-sx,rvy=b.vy-sy,vn=rvx*nx+rvy*ny;
  if(vn>=0)return 0;
  const imp=-vn,ee=imp<45?0:e;
  let tx=rvx-vn*nx,ty=rvy-vn*ny;
  const fr=1-Math.min(.12,imp*.00005),nvx=-ee*vn*nx+tx*fr,nvy=-ee*vn*ny+ty*fr;
  b.vx=nvx+sx;b.vy=nvy+sy;return imp}
function colSeg(b,s){
  let t=((b.x-s.ax)*s.dx+(b.y-s.ay)*s.dy)/s.L2;t=t<0?0:t>1?1:t;
  const qx=s.ax+s.dx*t,qy=s.ay+s.dy*t,dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy,rr=R+s.r;
  if(d2>=rr*rr)return;
  if(s.one&&((b.x-s.ax)*s.nx+(b.y-s.ay)*s.ny)<0)return;
  const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;
  b.x+=nx*(rr-d);b.y+=ny*(rr-d);
  const imp=bounce(b,nx,ny,s.e,s,0,0);
  if(imp)hit(s,b,imp,nx,ny);
}
function colCirc(b,c){
  const dx=b.x-c.x,dy=b.y-c.y,d2=dx*dx+dy*dy,rr=R+c.r;if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;b.x+=nx*(rr-d);b.y+=ny*(rr-d);
  const imp=bounce(b,nx,ny,c.e,c,0,0);
  if(c.kind==='bumper')hit(c,b,Math.max(imp,1),nx,ny);else if(imp)hit(c,b,imp,nx,ny);
}
function colFlip(b,f){
  const tx=f.px+Math.cos(f.ang)*FL,ty=f.py+Math.sin(f.ang)*FL,dx0=tx-f.px,dy0=ty-f.py;
  let t=((b.x-f.px)*dx0+(b.y-f.py)*dy0)/(FL*FL);t=t<0?0:t>1?1:t;
  const qx=f.px+dx0*t,qy=f.py+dy0*t,rr=R+FR0+(FR1-FR0)*t,dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;
  if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;b.x+=nx*(rr-d);b.y+=ny*(rr-d);
  const cx=b.x-nx*R,cy=b.y-ny*R,sx=-f.w*(cy-f.py),sy=f.w*(cx-f.px);
  const imp=bounce(b,nx,ny,.42,f,sx,sy);
  if(imp>260)sfx.rubber(Math.min(1,imp/2500));
}
function colBalls(a,b){const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*R*R||d2<1e-6)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,p=(2*R-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn>=0)return;const j=-(1.9)*vn/2;
  a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;if(-vn>150)sfx.clack(Math.min(1,-vn/2000))}

/* ---------- game state ---------- */
const g={state:'attract',score:0,ball:1,mult:1,relics:0,open:false,consp:0,sorc:0,aliens:[0,0],relicT:[0,0,0],
  saveUntil:0,last:0,hi:0,newHi:false,overAt:0,skill:false,jack:0,flash:{}};
try{g.hi=+localStorage.getItem('wp-pinball-hi')||0}catch(e){}
const fmt=n=>n.toLocaleString('en-US');
function add(p){if(g.state==='play')g.score+=p*g.mult}
function flash(k,d){g.flash[k]=now+(d||.6)}
let msgQ=null;
function msg(a,b,d,big){msgQ={a,b,until:now+(d||2),big:!!big};dmdDirty=true}
let big=null;function bigText(t,c){big={t,c:c||'#fff3c4',t0:now}}

function relic(){
  if(g.open){add(5000);return}
  g.relics=Math.min(5,g.relics+1);flash('cit'+(g.relics-1),1.2);
  if(g.relics>=5){g.open=true;sfx.unlock();msg('CITADEL UNLOCKED','SHOOT THE CITADEL',3);bigText('CITADEL OPEN','#c8ff3c')}
  else{msg('RELIC '+g.relics+' OF 5',(5-g.relics)+' MORE TO UNLOCK',1.8)}
}
function multUp(){if(g.mult<5){g.mult++;flash('mult',1.2);msg(g.mult+'X MULTIPLIER','ALL SCORES '+g.mult+'X',1.8);sfx.mult()}}
function laneConsp(){g.consp++;add(5000);flash('consp');
  if(g.consp>=3){g.consp=0;add(25000);sfx.complete();bigText('CONSPIRACY','#c8ff3c');msg('CONSPIRACY','UNCOVERED  +25,000',2);relic();multUp()}else{sfx.lane();msg('CONSPIRACY',g.consp+' OF 3',1.2)}}
function laneSorc(){g.sorc++;add(5000);flash('sorc');
  if(g.sorc>=2){g.sorc=0;add(25000);sfx.complete();bigText('SORCERY','#d8a6ff');msg('SORCERY','MASTERED  +25,000',2);relic();multUp()}else{sfx.lane();msg('SORCERY','1 OF 2',1.2)}}
function hitAlien(i){if(!g.aliens[i]){g.aliens[i]=1;add(2500);sfx.target()}else{add(500);sfx.target()}
  if(g.aliens[0]&&g.aliens[1]){g.aliens=[0,0];add(25000);sfx.complete();bigText('ALIENS','#c8ff3c');msg('ALIENS','CONTACT MADE  +25,000',2);relic();multUp();flash('aliens',1)}}
function hitRelic(i){sfx.target();add(2500);if(!g.relicT[i]){g.relicT[i]=1;relic()}else add(500);
  if(g.relicT.every(Boolean)){setTimeout(()=>{g.relicT=[0,0,0]},700);flash('relicsAll',.8);add(10000)}}
function citadel(){
  if(g.open){const j=250000*g.mult;g.score+=j;g.open=false;g.relics=0;g.jack++;
    sfx.jackpot();bigText('JACKPOT','#ffd23c');msg('JACKPOT',fmt(j),3,false);flash('jack',2);
    addBall(true);g.saveUntil=now+12}
  else{add(1000);sfx.locked();msg('CITADEL LOCKED','RELICS '+g.relics+' OF 5',1.4)}
}
function scoop(b){b.st='scoop';b.hold=now+1.3;b.x=229;b.y=418;b.vx=b.vy=0;add(10000);sfx.scoopIn();flash('scoop',1.3);relic()}

function hit(o,b,imp,nx,ny){
  switch(o.kind){
    case 'wall':if(imp>110)sfx.metal(Math.min(1,imp/2600));break;
    case 'post':if(imp>90)sfx.rubber(Math.min(1,imp/2200));break;
    case 'plunger':break;
    case 'sling':if(imp>130&&now-o.t>.12){o.t=now;b.vx+=nx*780;b.vy+=ny*780;add(110);sfx.sling()}else if(imp>90)sfx.rubber(.4);break;
    case 'bumper':{if(now-o.t>.05){o.t=now;const vo=b.vx*nx+b.vy*ny;if(vo<900){b.vx+=nx*(900-vo);b.vy+=ny*(900-vo)}add(1000);sfx.bumper(o.id)}break}
    case 'relic':if(imp>60&&now-o.t>.3){o.t=now;hitRelic(o.id)}break;
    case 'alien':if(imp>60&&now-o.t>.3){o.t=now;hitAlien(o.id)}break;
    case 'citadel':if(imp>70&&now-o.t>.4){o.t=now;citadel()}else if(imp>60)sfx.metal(.3);break;
  }
}
function sense(b){
  for(const s of sensors){const inside=b.x>s.x0&&b.x<s.x1&&b.y>s.y0&&b.y<s.y1;
    if(inside&&!b.sens[s.id]){b.sens[s.id]=1;
      if(s.id==='consp'){if(Math.abs(b.vy)>250){if(g.skill&&b.vy>0){g.skill=false;add(20000);msg('SKILL SHOT','+20,000',1.6);sfx.lane()}laneConsp()}}
      else if(s.id==='sorc'){if(Math.abs(b.vy)>250)laneSorc()}
      else if(s.id==='scoop'){if(b.vy<120)scoop(b)}
      else {add(1000);sfx.rollover();flash(s.id,.5)}
    } else if(!inside&&b.sens[s.id])b.sens[s.id]=0;
  }
}
function inShooter(b){return b.st==='play'&&b.x>962&&b.y>1300}
function serve(auto){const b=mkBall(987,1450);g.skill=!auto;if(auto)setTimeout(()=>{if(balls.includes(b)&&inShooter(b)){b.vy=-2700;sfx.launch(.8)}},700);return b}
function addBall(auto){serve(auto)}
function startGame(){Object.assign(g,{state:'play',score:0,ball:1,mult:1,relics:0,open:false,consp:0,sorc:0,aliens:[0,0],relicT:[0,0,0],saveUntil:0,jack:0,newHi:false});
  balls.length=0;serve(false);msg('BALL 1','PULL THE PLUNGER',2);sfx.start()}
function drained(b){balls.splice(balls.indexOf(b),1);
  if(g.state!=='play')return;
  if(now<g.saveUntil){msg('BALL SAVED','',1.6);sfx.saved();serve(true);return}
  if(balls.length)return;
  sfx.drain();g.mult=1;g.open=g.open; // relics carry over between balls
  if(g.ball<3){g.ball++;msg('BALL '+g.ball,'',2);setTimeout(()=>{if(g.state==='play')serve(false)},1100)}
  else{g.state='over';g.overAt=now;if(g.score>g.hi){g.hi=g.score;g.newHi=true;try{localStorage.setItem('wp-pinball-hi',g.hi)}catch(e){}}
    msg('GAME OVER',fmt(g.score),4)}
}

/* ---------- physics step ---------- */
function step(h){
  now+=h;
  for(const f of flips)stepFlip(f,h);
  // plunger
  if(plg.charging){plg.pull=Math.min(1,(performance.now()-plg.t0)/900)}
  const py=1472+plg.pull*55;plSeg.ay=plSeg.by=py;
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];
    if(b.st==='scoop'){if(now>b.hold){b.st='play';b.x=232;b.y=440;b.vx=60+Math.random()*80;b.vy=750;sfx.kick()}continue}
    b.vy+=G*h;
    const sp=Math.hypot(b.vx,b.vy);if(sp>VMAX){b.vx*=VMAX/sp;b.vy*=VMAX/sp}
    b.vx*=1-.12*h;b.vy*=1-.12*h;
    b.x+=b.vx*h;b.y+=b.vy*h;
    for(const s of segs)colSeg(b,s);
    for(const c of circs)colCirc(b,c);
    colFlip(b,fL);colFlip(b,fR);
    for(let j=0;j<i;j++)if(balls[j].st==='play')colBalls(balls[j],b);
    sense(b);
    if(b.y>H+40||b.x<0||b.x>W){drained(b)}
  }
}

/* ---------- input ---------- */
const ptrs=new Map();
function setFlip(side,on){const f=side==='L'?fL:fR;if(f.on===on)return;f.on=on;
  if(g.state!=='play')return;on?sfx.flipUp(side):sfx.flipDown(side);if(on&&navigator.vibrate)try{navigator.vibrate(8)}catch(e){}}
function shooterBall(){return balls.find(b=>inShooter(b)&&b.y>1380)}
function press(side){
  audio();
  if(g.state==='attract'||(g.state==='over'&&now-g.overAt>1.2)){startGame();return}
  if(g.state!=='play')return;
  if(side==='R'&&shooterBall()&&!plg.charging){plg.charging=true;plg.t0=performance.now();sfx.pull()}
  setFlip(side,true);
}
function release(side){
  setFlip(side,false);
  if(side==='R'&&plg.charging){plg.charging=false;launch()}
}
function launch(){const p=plg.pull;plg.pull=0;plg.snap=1;const b=shooterBall();

function drawShadow(b){const sp=Math.hypot(b.vx,b.vy);
  ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.ellipse(b.x+7,b.y+10,RV*1.05,RV*.92,0,0,7);ctx.fill();
  if(sp>2000&&b.st==='play'){const k=Math.min(.2,(sp-2000)/8000);for(let i=1;i<=3;i++){ctx.globalAlpha=k/i;ctx.fillStyle='#e8ecf2';ctx.beginPath();ctx.arc(b.x-b.vx*i*.006,b.y-b.vy*i*.006,RV*.92,0,7);ctx.fill()}ctx.globalAlpha=1}}
function drawFlashes(){
  for(const c of bumpers){const k=1-(now-c.t)/.16;if(k>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=k*.75;ctx.drawImage(GW,c.x-c.r*1.9,c.y-c.r*1.9,c.r*3.8,c.r*3.8);
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.strokeStyle=`rgba(255,250,200,${k})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(c.x,c.y,c.r+4+(1-k)*14,0,7);ctx.stroke()}}
  for(const s of segs){if(s.kind!=='sling')continue;const k=1-(now-s.t)/.14;if(k>0){ctx.strokeStyle=`rgba(255,245,210,${k})`;ctx.lineWidth=7;ctx.lineCap='round';
      const mx=(s.ax+s.bx)/2,my=(s.ay+s.by)/2,sg=((512-mx)*s.nx+(800-my)*s.ny)>0?1:-1;
      ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.quadraticCurveTo(mx+s.nx*sg*16*k,my+s.ny*sg*16*k,s.bx,s.by);ctx.stroke()}}
}
function drawBig(){if(!big)return;const t=now-big.t0;if(t>1.6){big=null;return}
  const k=t<.15?t/.15:t>1.2?1-(t-1.2)/.4:1,s=.85+.15*Math.min(1,t/.15);
  ctx.save();ctx.translate(W/2,820);ctx.scale(s,s);ctx.globalAlpha=k;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 92px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.lineJoin='round';ctx.lineWidth=16;ctx.strokeStyle='#1a0726';ctx.strokeText(big.t,0,0);
  ctx.fillStyle=big.c;ctx.fillText(big.t,0,0);ctx.restore()}
function drawOverlay(){
  if(g.state==='play')return;
  ctx.fillStyle='rgba(8,3,14,.66)';ctx.fillRect(0,0,W,H);
  // spotlight the painted logo instead of stacking a second one on top
  ctx.save();ctx.beginPath();ctx.ellipse(526,724,300,128,0,0,7);ctx.clip();ctx.drawImage(field,0,0,W,H);ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f3e6cf';
  if(g.state==='over'){ctx.font='800 64px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillText('GAME OVER',W/2,330);
    ctx.font='700 52px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillStyle='#ffd23c';ctx.fillText(fmt(g.score),W/2,405);
    ctx.fillStyle='#c9b8d6';ctx.font='600 30px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillText(g.newHi?'New high score':'High score '+fmt(g.hi),W/2,462)}
  ctx.font='600 34px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillStyle='#e6d8f0';ctx.fillText('Collect 5 relics to unlock the Citadel',W/2,920);
  if(g.state==='attract'||now-g.overAt>1.2){ctx.globalAlpha=.55+.45*Math.sin(now*5);ctx.font='800 58px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillStyle='#c8ff3c';
    ctx.fillText(touchUI?'TAP TO PLAY':'CLICK OR PRESS SPACE',W/2,1010);ctx.globalAlpha=1}
  ctx.font='500 30px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.fillStyle='#d6c6e2';
  if(touchUI){ctx.fillText('Tap the left or right half to flip',W/2,1110);ctx.fillText('Hold the right half to pull the plunger',W/2,1156)}
  else{ctx.fillText('Flippers: Z and / (or the arrow keys, or click each half)',W/2,1110);ctx.fillText('Plunger: hold Space and let go',W/2,1156)}
}
const touchUI=matchMedia('(pointer:coarse)').matches;
function drawHint(){if(g.state!=='play')return;const b=shooterBall();if(!b)return;
  ctx.save();ctx.globalAlpha=.6+.4*Math.sin(now*6);ctx.fillStyle='#c8ff3c';ctx.font='800 30px "Helvetica Neue",Helvetica,Arial,sans-serif';ctx.textAlign='right';
  ctx.fillText(plg.charging?'LET GO TO LAUNCH':(touchUI?'HOLD RIGHT SIDE ▸':'HOLD SPACE ▸'),945,1500);ctx.restore()}
function drawDebug(){ctx.save();ctx.lineWidth=2;
  for(const s of segs){ctx.strokeStyle=s.kind==='wall'?'#0ff':s.one?'#f0f':'#ff0';ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.lineTo(s.bx,s.by);ctx.stroke()}
  for(const c of circs){ctx.strokeStyle=c.kind==='bumper'?'#f0f':'#0f0';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.stroke()}
  for(const f of flips){ctx.strokeStyle='#fff';const tx=f.px+Math.cos(f.ang)*FL,ty=f.py+Math.sin(f.ang)*FL;ctx.beginPath();ctx.arc(f.px,f.py,FR0,0,7);ctx.moveTo(tx+FR1,ty);ctx.arc(tx,ty,FR1,0,7);ctx.stroke()}
  for(const s of sensors){ctx.strokeStyle='#f80';ctx.strokeRect(s.x0,s.y0,s.x1-s.x0,s.y1-s.y0)}
  ctx.restore()}

/* ---------- layout & loop ---------- */
let scale=1,dpr=1;
function layout(){
  const cs=getComputedStyle($('#wrap'));const pw=innerWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-12,ph=innerHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-12;
  const bar=24+6,gap=6,dr=DH/DW;
  let w=Math.min(pw,(ph-bar-gap)/(1.5+dr));w=Math.floor(w);
  const dh=Math.round(w*dr);dpr=Math.min(2,devicePixelRatio||1);
  pf.style.width=w+'px';pf.style.height=Math.round(w*1.5)+'px';pf.width=Math.round(w*dpr);pf.height=Math.round(w*1.5*dpr);
  dmd.style.width=w+'px';dmd.style.height=dh+'px';dmd.width=Math.round(w*dpr);dmd.height=Math.round(dh*dpr);
  $('#bar').style.width=w+'px';scale=pf.width/W;dmdDirty=true;
}
addEventListener('resize',layout);layout();
let last=0,acc=0,ready=false;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(ready&&!window.__pinPause){acc+=dt;while(acc>=HSTEP){step(HSTEP);acc-=HSTEP}}
  // roll orientation
  for(const b of balls)if(b.st==='play')rot(b,b.vy/R,-b.vx/R,0,dt);
  // stuck ball: give it a nudge
  for(const b of balls){if(b.st!=='play'||inShooter(b)||g.state!=='play'||b.y>1240){b.still=0;continue}
    if(!b.anc||Math.hypot(b.x-b.anc[0],b.y-b.anc[1])>8){b.anc=[b.x,b.y];b.still=0}else if((b.still+=dt)>2.5){b.vy=-700;b.vx=(b.x<512?1:-1)*(200+Math.random()*300);b.still=0;b.anc=null;sfx.kick()}}
  render();drawDMD();updRoll();
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  if(!field.complete||!field.naturalWidth){ctx.fillStyle='#120a1c';ctx.fillRect(0,0,W,H);return}
  ctx.drawImage(field,0,0,W,H);
  drawLamps();
  if(spr.complete&&spr.naturalWidth){if(!sil)silhouettes();drawTargets();drawFlip(fL,'L',1);drawFlip(fR,'R',1)}
  drawFlashes();
  for(const b of balls)drawShadow(b);
  if(sil){drawFlip(fL,'L');drawFlip(fR,'R')}
  drawPlunger();
  for(const b of balls)drawBall(b);
  drawBig();drawHint();
  if(DEBUG)drawDebug();
  drawOverlay();
}
Promise.all([field.decode?field.decode().catch(()=>{}):0,spr.decode?spr.decode().catch(()=>{}):0]).then(()=>{ready=true});
requestAnimationFrame(frame);
// test hook
window.__pin={g,balls,fL,fR,plg,press,release,step,mkBall,startGame,segs};
})();
</script>
