:root{
  --bg:#F2F1ED;--surface:#FFFFFF;--ink:#12171D;--muted:#47525E;--line:#CBD2DA;--focus:#1F5FAF;
  --body:"Space Grotesk", system-ui, sans-serif;
  --panel-hi:#FBFBF9;--panel-lo:#E3E3DF;--panel-edge:#BDBDB8;
  --key-hi:#FFFFFE;--key-lo:#E1E1DD;--key-edge:#B3B3AE;--key-base:#A6A6A1;--engrave:rgba(255,255,255,.9);
  --face-hi:#FAF9F6;--face-lo:#E9E8E3}
:root[data-theme="dark"]{--bg:#0D1015;--surface:#161A21;--ink:#F1F3F6;--muted:#A4ADB8;--line:#323A45;--focus:#7FB0F0;
  --panel-hi:#34363B;--panel-lo:#1D1E21;--panel-edge:#0B0C0E;
  --key-hi:#3C3E44;--key-lo:#202125;--key-edge:#0B0C0E;--key-base:#050506;--engrave:rgba(0,0,0,.6);
  --face-hi:#23252A;--face-lo:#121316}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;background:var(--bg);transition:background-color .5s ease,color .5s ease}
body{color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,p{margin:0}
button,a{cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* the page is the face of one device, as on the portfolio */
.field{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,var(--face-hi),var(--face-lo));background-color:var(--face-lo)}
.field::before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.08)}
:root[data-theme="dark"] .field::before{box-shadow:inset 0 0 160px rgba(0,0,0,.55)}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.field canvas.can-grab{cursor:grab}
.field canvas.dragging{cursor:grabbing}

.center{position:fixed;inset:0;z-index:1;display:grid;place-items:start center;pointer-events:none;text-align:center;
  padding-top:calc(env(safe-area-inset-top, 0px) + 18px);padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
/* the title is Coolvetica set as fixed outlines (an image), like the name on the home page: its desktop license does not allow web embedding */
h1{font-size:min(120px, calc((100vw - 60px) / 4.9));line-height:1.1}
h1 a{color:inherit;pointer-events:auto;display:inline-block;padding:0 .1em}
.wordmark{height:.72em;width:auto;fill:currentColor;display:block;color:#1E2024;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.35)) drop-shadow(0 1.5px 0 rgba(255,255,255,.95))}
:root[data-theme="dark"] .wordmark{color:#E4E5E8;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.9)) drop-shadow(0 1.5px 0 rgba(255,255,255,.14))}

.hud{position:fixed;left:0;right:0;bottom:0;z-index:2;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;
  padding:0 max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(20px, env(safe-area-inset-left, 0px))}
.hud button,.hud a{pointer-events:auto}
.hint{font:500 14px/1.4 var(--body);max-width:46ch;text-shadow:0 1px 0 var(--engrave)}
.controls{display:flex;gap:10px;flex-wrap:wrap}
/* keycaps */
.btn{display:inline-flex;align-items:center;gap:6px;position:relative;border:1px solid var(--key-edge);border-radius:10px;padding:9px 14px 10px;color:var(--ink);text-decoration:none;
  font:700 15px/1 var(--body);background:linear-gradient(180deg,var(--key-hi),var(--key-lo));text-shadow:0 1px 0 var(--engrave);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.06),0 2px 0 var(--key-base),0 6px 10px -4px rgba(0,0,0,.4);transition:transform .1s ease,box-shadow .1s ease}
:root[data-theme="dark"] .btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 var(--key-base),0 6px 10px -4px rgba(0,0,0,.8)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 var(--key-base),0 2px 4px -2px rgba(0,0,0,.4)}
.btn[aria-pressed="true"]{background:linear-gradient(180deg,var(--key-lo),var(--key-hi));transform:translateY(2px);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 0 0 var(--key-base),0 2px 4px -2px rgba(0,0,0,.35)}
.btn.orange{color:#fff;border-color:#B23A0C;text-shadow:0 -1px 0 rgba(0,0,0,.25);background:linear-gradient(180deg,#FF8148,#EE5016);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #B23A0C,0 5px 9px -3px rgba(0,0,0,.4)}

/* a brushed panel, like the portfolio's cards: the camera viewfinder and a fig's details */
.panel{position:fixed;z-index:5;background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));border:1px solid var(--panel-edge);border-radius:20px;padding:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 26px 44px -20px rgba(0,0,0,.5),0 6px 12px -6px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
:root[data-theme="dark"] .panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 26px 44px -18px rgba(0,0,0,.85)}
.panel .keys{display:flex;gap:8px;flex-wrap:wrap}
.cam{left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px, calc(100vw - 32px))}
.cam .glass{position:relative;border-radius:12px;overflow:hidden;background:#0B0C0E;aspect-ratio:3/4;max-height:58vh;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 var(--engrave),0 0 0 1px rgba(0,0,0,.55)}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .tip{font-size:14px;color:var(--muted);text-shadow:0 1px 0 var(--engrave)}
.figcard{width:min(260px, calc(100vw - 32px))}
.figcard b{font-size:17px}
.figcard small{display:block;color:var(--muted);font-size:13px}
@media (max-width:640px){.hint{font-size:13px}}
@media (prefers-reduced-motion: reduce){.btn,html,body{transition:none}}
</style>

<script>
(function(){
"use strict";

const {Engine,Bodies,Body,Composite,Mouse,MouseConstraint,Events,Query}=Matter;
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const hint=$("hint"), HINT=hint.textContent;

/* ---------- background removal ----------
   Runs in the browser, so the photo never leaves the device. The backdrop colour is read from the photo's border
   (per side, so a gradient backdrop still matches) and flooded away from the edges. Shadows only darken, so darker
   counts for less than lighter or a change of hue. The largest solid piece left is the fig. */
function lab(r,g,b){
  const f=v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92;};
  const R=f(r),G=f(g),B=f(b);
  let x=(R*.4124+G*.3576+B*.1805)/.95047,y=R*.2126+G*.7152+B*.0722,z=(R*.0193+G*.1192+B*.9505)/1.08883;
  const h=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;x=h(x);y=h(y);z=h(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
function cutout(cv){
  const W=cv.width,H=cv.height,c=cv.getContext("2d",{willReadFrequently:true}),img=c.getImageData(0,0,W,H),d=img.data,N=W*H;
  let clear=0;for(let i=3;i<d.length;i+=4) if(d[i]<200) clear++;
  if(clear>N*.05) return trim(cv);
  const L=new Float32Array(N),A=new Float32Array(N),B=new Float32Array(N);
  for(let i=0;i<N;i++){const l=lab(d[i*4],d[i*4+1],d[i*4+2]);L[i]=l[0];A[i]=l[1];B[i]=l[2];}
  const band=Math.max(2,Math.round(Math.min(W,H)*.03)),sides={t:[],b:[],l:[],r:[]};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;
    if(y<band) sides.t.push(i); else if(y>=H-band) sides.b.push(i);
    if(x<band) sides.l.push(i); else if(x>=W-band) sides.r.push(i);}
  const med=(idx,a)=>{const v=idx.map(i=>a[i]).sort((p,q)=>p-q);return v[v.length>>1];};
  const m={};for(const k in sides) m[k]=[med(sides[k],L),med(sides[k],A),med(sides[k],B)];
  const dist=new Float32Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,u=x/(W-1||1),v=y/(H-1||1),wl=1-u,wr=u,wt=1-v,wb=v,s=wl+wr+wt+wb;
    const bg=[0,1,2].map(k=>(m.l[k]*wl+m.r[k]*wr+m.t[k]*wt+m.b[k]*wb)/s);

  let wB=0,sB=0,best=0,thr=12;
  for(let i=0;i<bins;i++){wB+=hist[i];if(!wB) continue;const wF=N-wB;if(!wF) break;sB+=i*hist[i];
    const v=wB*wF*(sB/wB-(sum-sB)/wF)**2;if(v>best){best=v;thr=(i+1)/bins*max;}}
  thr=Math.max(7,Math.min(26,thr));

  const push=i=>{if(!bgm[i]&&dist[i]<thr){bgm[i]=1;q[qt++]=i;}};
  for(let x=0;x<W;x++){push(x);push((H-1)*W+x);}
  for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
  while(qh<qt){const i=q[qh++],x=i%W,y=(i/W)|0;if(x>0)push(i-1);if(x<W-1)push(i+1);if(y>0)push(i-W);if(y<H-1)push(i+W);}
  // gaps enclosed by an arm that clearly match the backdrop go too
  for(let i=0;i<N;i++) if(!bgm[i]&&dist[i]<thr*.55) bgm[i]=2;
  const lb=new Int32Array(N);let bid=0,bn=0,id=0;
  for(let s=0;s<N;s++){
    if(bgm[s]||lb[s]) continue;id++;let n=0;qh=qt=0;q[qt++]=s;lb[s]=id;
    while(qh<qt){const i=q[qh++],x=i%W,y=(i/W)|0;n++;
      for(const j of [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1]) if(j>=0&&!bgm[j]&&!lb[j]){lb[j]=id;q[qt++]=j;}}
    if(n>bn){bn=n;bid=id;}
  }
  if(bn<N*.01) return trim(cv);
  for(let i=0;i<N;i++) d[i*4+3]=lb[i]===bid?255:0;

}
function trim(cv){
  const d=cv.getContext("2d",{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height).data;
  let x0=cv.width,y0=cv.height,x1=-1,y1=-1;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++) if(d[(y*cv.width+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0) return cv;
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext("2d").drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}
function toCanvas(im,maxSide){
  const w=im.videoWidth||im.naturalWidth||im.width,h=im.videoHeight||im.naturalHeight||im.height,k=Math.min(1,maxSide/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(im,0,0,c.width,c.height);return c;
}
const loadImage=src=>new Promise((res,rej)=>{const u=src instanceof Blob?URL.createObjectURL(src):src;const im=new Image();
  im.onload=()=>{if(src instanceof Blob) URL.revokeObjectURL(u);res(im);};im.onerror=rej;im.src=u;});

/* ---------- square pixels (the portfolio's method) ---------- */
let dark=false;
function sample(src,cols,rows){
  let cur=src,w=src.width,h=src.height;
  while(w/2>cols*1.5){const n=document.createElement("canvas");n.width=Math.max(cols,Math.round(w/2));n.height=Math.max(rows,Math.round(h/2));
    const c=n.getContext("2d");c.imageSmoothingQuality="high";c.drawImage(cur,0,0,n.width,n.height);cur=n;w=n.width;h=n.height;}
  const out=document.createElement("canvas");out.width=cols;out.height=rows;
  const c=out.getContext("2d",{willReadFrequently:true});c.imageSmoothingQuality="high";c.drawImage(cur,0,0,cols,rows);
  return c.getImageData(0,0,cols,rows).data;
}
function tone(r,g,b){
  const L=.2126*r+.7152*g+.0722*b;
  if(!dark&&L>226){const t=(L-226)/29*.35;return [r*(1-t)+150*t,g*(1-t)+158*t,b*(1-t)+168*t];}
  if(dark&&L<70){const t=(70-L)/70*.55;return [r*(1-t)+92*t,g*(1-t)+98*t,b*(1-t)+108*t];}
  return [r,g,b];
}
// fit the source inside a box (bw x bh) at pixel size P, and paint it as square pixels
function pixelSprite(src,bw,bh,P){
  const ar=src.height/src.width;let w=bw,h=bw*ar;if(h>bh){h=bh;w=bh/ar;}
  const cols=Math.max(6,Math.round(w/P)),rows=Math.max(6,Math.round(h/P)),d=sample(src,cols,rows),dots=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=(j*cols+i)*4,a=d[k+3]/255;if(a<.35) continue;
    dots.push({x:(i+.5)*P,y:(j+.5)*P,r:d[k]/a,g:d[k+1]/a,b:d[k+2]/a,a});}
  return {dots,P,w:cols*P,h:rows*P};
}
function paintSprite(m){
  const cv=m.canvas||document.createElement("canvas");cv.width=Math.ceil(m.w*dpr);cv.height=Math.ceil(m.h*dpr);
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,m.w,m.h);
  for(const p of m.dots){const [r,g,b]=tone(Math.min(255,p.r),Math.min(255,p.g),Math.min(255,p.b)),s=m.P*.42*Math.min(1,.55+p.a*.5);
    c.fillStyle=`rgb(${r|0},${g|0},${b|0})`;c.fillRect(p.x-s,p.y-s,2*s,2*s);}

}
// the plus icon: a chunky plus made of the same square pixels
function plusSprite(P){
  const n=11,dots=[];
  for(let j=0;j<n;j++)for(let i=0;i<n;i++) if((i>=4&&i<=6)||(j>=4&&j<=6)) dots.push({x:(i+.5)*P,y:(j+.5)*P,r:0,g:0,b:0,a:1,plus:true});
  return {dots,P,w:n*P,h:n*P,plus:true};
}
function paintPlus(m){
  m.dots.forEach(p=>{const v=dark?236:30;p.r=v;p.g=v+2;p.b=v+6;});paintSprite(m);
}

/* ---------- saved figs (this browser only) ---------- */
const KEY="brickstash.figs.v1";
let figs=[];
try{figs=JSON.parse(localStorage.getItem(KEY)||"[]").filter(f=>f&&f.src);}catch(_){figs=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(figs));}catch(_){/* storage full or blocked: the figs just won't survive a reload */}}
const imgs={};
function figImage(f){return imgs[f.id]||(imgs[f.id]=loadImage(f.src));}

/* ---------- physics ---------- */
const field=$("field"),canvas=$("world"),ctx=canvas.getContext("2d");
let W=0,H=0,dpr=1,T=96;
const engine=Engine.create({enableSleeping:false});engine.gravity.y=0;
let walls=[],bodies=[],gravityOn=false,dragging=null,hover=null,picked=null;

function size(){
  W=field.clientWidth;H=field.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  if(walls.length) Composite.remove(engine.world,walls);
  const t=400;
  // the floor sits just above the keys, so nothing lands behind them
  const F=Math.min(H,document.querySelector(".hud").getBoundingClientRect().top-canvas.getBoundingClientRect().top+4);
  walls=[Bodies.rectangle(W/2,F+t/2,W+2*t,t,{isStatic:true}),Bodies.rectangle(W/2,-t/2,W+2*t,t,{isStatic:true}),
         Bodies.rectangle(-t/2,H/2,t,H+2*t,{isStatic:true}),Bodies.rectangle(W+t/2,H/2,t,H+2*t,{isStatic:true})];
  walls.forEach(w=>{w.restitution=.35;w.friction=.3;});Composite.add(engine.world,walls);
}
// home-screen grid between the title and the keys: icons fill rows from the top left, the plus comes last
function grid(n){
  const r=canvas.getBoundingClientRect(),nm=document.querySelector("h1").getBoundingClientRect(),hd=document.querySelector(".hud").getBoundingClientRect();
  const pad=Math.max(16,W*.04),top=nm.bottom-r.top+20,bot=hd.top-r.top+8,AW=W-2*pad,AH=Math.max(120,bot-top);
  let cols=Math.max(4,Math.min(7,Math.floor(AW/180))),cw=AW/cols,ch=Math.min(cw*1.12,170);
  while(Math.ceil(n/cols)*ch>AH&&ch>60){ch*=.92;cw=Math.min(cw,ch/1.12);cols=Math.max(cols,Math.floor(AW/cw));cw=AW/cols;}
  const t=Math.min(cw*.74,(ch-20)*.84,128),rows=Math.ceil(n/cols);
  // rows are centred, like the portfolio's Phone mode, so a lone plus sits under the title
  const slots=[];for(let i=0;i<n;i++){const row=Math.floor(i/cols),col=i%cols,inRow=row===rows-1?n-row*cols:cols;slots.push({x:pad+(AW-inRow*cw)/2+(col+.5)*cw,y:top+row*ch+t/2+4});}
  return {t,slots};
}
function makeBody(kind,fig,x,y){
  const b=Bodies.rectangle(x,y,T,T,{chamfer:{radius:T*.225},restitution:.35,friction:.3,frictionAir:.02,density:.001});
  b.plugin={kind,fig,born:performance.now()};
  return b;
}
async function sprite(b){
  const box=T*.74,P=Math.max(1.8,Math.min(3.4,box/36));
  if(b.plugin.kind==="plus"){b.plugin.m=plusSprite(Math.max(2.2,T*.42/11));paintPlus(b.plugin.m);return;}
  const im=await figImage(b.plugin.fig);
  b.plugin.m=pixelSprite(im,box,box,P);paintSprite(b.plugin.m);
}
function rebuild(){
  const g=grid(figs.length+1),old=new Map(bodies.map(b=>[b.plugin.fig?b.plugin.fig.id:"plus",b]));
  const sizeChanged=Math.abs(g.t-T)>1;T=g.t;
  const want=[...figs.map(f=>({kind:"fig",fig:f,id:f.id})),{kind:"plus",fig:null,id:"plus"}];
  const next=[];
  want.forEach((w,i)=>{
    let b=old.get(w.id);const s=g.slots[i];
    if(b&&sizeChanged){Composite.remove(engine.world,b);const nb=makeBody(w.kind,w.fig,b.position.x,b.position.y);nb.plugin.born=0;b=nb;Composite.add(engine.world,b);sprite(b);}
    if(!b){b=makeBody(w.kind,w.fig,s.x,s.y);Composite.add(engine.world,b);sprite(b);}
    old.delete(w.id);b.plugin.slot=s;b.plugin.t0=performance.now();b.plugin.stuck=0;next.push(b);
  });
  old.forEach(b=>Composite.remove(engine.world,b));
  bodies=next;
}

Events.on(engine,"afterUpdate",()=>{
  for(const b of bodies){
    const p=b.position;
    if(p.x<-80||p.x>W+80||p.y<-80||p.y>H+80){Body.setPosition(b,{x:W/2,y:H/2});Body.setVelocity(b,{x:0,y:0});}
    if(gravityOn||b===dragging||!b.plugin.slot) continue;
    // glide back to its spot on the home screen, upright, bumping past neighbours rather than through them
    const s=b.plugin.slot,a=((b.angle+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
    if(reduced){Body.setAngle(b,0);Body.setPosition(b,s);Body.setVelocity(b,{x:0,y:0});continue;}
    let dx=(s.x-p.x)*.12,dy=(s.y-p.y)*.12;const d=Math.hypot(dx,dy),far=d/.12;if(d>14){dx*=14/d;dy*=14/d;}
    const pl=b.plugin,last=pl.lastFar??far;pl.stuck=far>12&&last-far<.15?(pl.stuck||0)+1:Math.max(0,(pl.stuck||0)-2);pl.lastFar=far;
    if(performance.now()-pl.t0>3500&&far>24&&pl.stuck>30) b.isSensor=true; else if(b.isSensor&&far<12) b.isSensor=false;
    if(far<.6&&Math.abs(a)<.01){Body.setPosition(b,s);Body.setVelocity(b,{x:0,y:0});Body.setAngle(b,0);Body.setAngularVelocity(b,0);continue;}
    const v=b.velocity;Body.setVelocity(b,{x:v.x*.7+dx*.3,y:v.y*.7+dy*.3});
    Body.setAngularVelocity(b,b.angularVelocity*.7-a*.03);
  }
});

/* ---------- drawing: glossy app tiles, as in the portfolio's Phone mode ---------- */
function squircle(c,x,y,s){c.beginPath();c.roundRect(x,y,s,s,s*.225);}
function tileBack(s){
  const x=-s/2,y=-s/2;ctx.save();
  ctx.shadowColor=dark?"rgba(0,0,0,.55)":"rgba(20,24,32,.28)";ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  const g=ctx.createLinearGradient(0,y,0,y+s);
  if(dark){g.addColorStop(0,"#5A5F69");g.addColorStop(1,"#23262C");} else {g.addColorStop(0,"#FFFFFF");g.addColorStop(1,"#D3D7DE");}
  ctx.fillStyle=g;squircle(ctx,x,y,s);ctx.fill();ctx.shadowColor="transparent";
  ctx.lineWidth=1.2;ctx.strokeStyle=dark?"rgba(0,0,0,.6)":"rgba(30,34,42,.22)";ctx.stroke();
  ctx.lineWidth=1;ctx.strokeStyle=dark?"rgba(255,255,255,.14)":"rgba(255,255,255,.9)";squircle(ctx,x+1.4,y+1.4,s-2.8);ctx.stroke();
  ctx.restore();
}
function tileGloss(s){

  const g=ctx.createLinearGradient(0,y,0,y+s*.5);g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(1,"rgba(255,255,255,.06)");
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,y-s*.32,s*.95,s*.8,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function nameOf(b){return b.plugin.kind==="plus"?"Add fig":(b.plugin.fig.name||"Minifig");}
function frame(){
  const now=performance.now();
  Engine.update(engine,1000/60);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.font="600 12px "+getComputedStyle(document.documentElement).getPropertyValue("--body");
  for(const b of bodies){
    const m=b.plugin.m;
    ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
    // a new icon pops in; the one you're holding or looking at pulses gently
    const age=b.plugin.born?(now-b.plugin.born)/420:1;
    if(!reduced&&age<1){const k=Math.max(.01,1+2.2*Math.pow(age-1,3)+1.2*Math.pow(age-1,2));ctx.scale(k,k);}
    if(!reduced&&(b===dragging||b===picked)){const k=1+.06*(.5-.5*Math.cos(now/1000*Math.PI*2/.9));ctx.scale(k,k);}
    tileBack(T);
    if(m&&m.canvas) ctx.drawImage(m.canvas,-m.w/2,-m.h/2,m.w,m.h);
    else if(b.plugin.kind==="fig"){ // still cutting out: a blinking pixel
      if(Math.floor(now/400)%2){ctx.fillStyle=dark?"#E4E5E8":"#1E2024";ctx.fillRect(-3,-3,6,6);}
    }
    tileGloss(T);
    ctx.restore();
    // the label stays upright under the tile, wherever the tile has turned
    const a=b.angle,ly=T/2;
    ctx.save();ctx.textAlign="center";ctx.textBaseline="top";ctx.fillStyle=dark?"#F1F3F6":"#12171D";
    ctx.fillText(nameOf(b),b.position.x-ly*Math.sin(a),b.position.y+ly*Math.cos(a)+6);ctx.restore();
  }

/* ---------- pointer: drag and throw; tap + to add, tap a fig for its details ---------- */
const mouse=Mouse.create(canvas);
["mousewheel","DOMMouseScroll","wheel"].forEach(ev=>canvas.removeEventListener(ev,mouse.mousewheel));
const mc=MouseConstraint.create(engine,{mouse,constraint:{stiffness:.15,damping:.1,render:{visible:false}}});
Composite.add(engine.world,mc);
Events.on(mc,"startdrag",e=>{dragging=e.body;canvas.classList.add("dragging");closeFig();});
Events.on(mc,"enddrag",e=>{dragging=null;canvas.classList.remove("dragging");if(e.body&&e.body.plugin) e.body.plugin.t0=performance.now();});
window.addEventListener("mouseup",e=>{if(e.target!==canvas) mouse.mouseup(e);});
const local=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
const hit=p=>{const h=Query.point(bodies,p);return h.length?h[h.length-1]:null;};
let down=null;
canvas.addEventListener("pointerdown",e=>{down={...local(e),t:performance.now()};});
canvas.addEventListener("pointerup",e=>{
  if(!down) return;const p=local(e),moved=Math.hypot(p.x-down.x,p.y-down.y),dt=performance.now()-down.t;down=null;
  if(moved>=8||dt>=450) return;
  const b=hit(p);
  if(!b){closeFig();return;}
  if(b.plugin.kind==="plus"){closeFig();openCamera();}
  else if(picked===b) closeFig(); else openFig(b);
});
canvas.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){hover=hit(local(e));canvas.classList.toggle("can-grab",!!hover);}});
$("addSr").addEventListener("click",openCamera);

/* a fig's details sit beside its icon */
const card=$("figcard");
function openFig(b){
  picked=b;const f=b.plugin.fig;
  $("figName").textContent=f.name;$("figWhen").textContent="Added "+new Date(f.t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  card.hidden=false;
  const r=canvas.getBoundingClientRect(),cw=card.offsetWidth,chh=card.offsetHeight,g=14;
  let x=r.left+b.position.x+T/2+g,y=r.top+b.position.y-chh/2;
  if(x+cw>innerWidth-12) x=r.left+b.position.x-T/2-g-cw;
  if(x<12){x=r.left+b.position.x-cw/2;y=r.top+b.position.y+T/2+30;}
  card.style.left=Math.max(12,Math.min(innerWidth-cw-12,x))+"px";card.style.top=Math.max(12,Math.min(innerHeight-chh-12,y))+"px";
}
function closeFig(){picked=null;card.hidden=true;}
$("figRemove").addEventListener("click",()=>{
  if(!picked) return;const id=picked.plugin.fig.id;figs=figs.filter(f=>f.id!==id);delete imgs[id];save();closeFig();rebuild();
});

/* ---------- camera ----------
   On a phone, + opens the camera app straight away. On a computer it opens a viewfinder here,
   with Choose file as the way in when there's no camera or it isn't allowed. */
const fileIn=$("file"),cam=$("cam"),video=$("video");let stream=null;
const coarse=matchMedia("(pointer: coarse)").matches;
async function openCamera(){
  if(coarse||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fileIn.click();return;}
  cam.hidden=false;$("shoot").disabled=true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:1280}},audio:false});
    video.srcObject=stream;await video.play();$("shoot").disabled=false;$("shoot").focus();
  }catch(_){$("pick").focus();}
}
function closeCamera(){cam.hidden=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
$("camClose").addEventListener("click",closeCamera);
$("pick").addEventListener("click",()=>{closeCamera();fileIn.click();});
$("shoot").addEventListener("click",()=>{const c=toCanvas(video,640);closeCamera();addFig(c);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!cam.hidden) closeCamera(); else closeFig();}});
fileIn.addEventListener("change",async()=>{
  const f=fileIn.files[0];fileIn.value="";if(!f) return;
  try{addFig(toCanvas(await loadImage(f),640));}catch(_){say("That photo didn't open. Try a JPEG or PNG.");}
});
function say(t,ms=3200){hint.textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>hint.textContent=HINT,ms);}

let count=figs.reduce((n,f)=>Math.max(n,f.n||0),0);
function addFig(photo){
  say("Cutting out your fig…",60000);
  // let the "cutting out" message paint before the work starts
  setTimeout(()=>{
    let cut;try{cut=cutout(photo);}catch(_){say("Couldn't cut that one out. Try a plainer background.");return;}
    // keep a small copy: enough for a crisp icon, small enough to remember
    const k=Math.min(1,220/Math.max(cut.width,cut.height)),s=document.createElement("canvas");
    s.width=Math.max(1,Math.round(cut.width*k));s.height=Math.max(1,Math.round(cut.height*k));
    const c=s.getContext("2d");c.imageSmoothingQuality="high";c.drawImage(cut,0,0,s.width,s.height);
    count++;
    const fig={id:"f"+Date.now().toString(36),n:count,name:"Minifig "+count,t:Date.now(),src:s.toDataURL("image/png")};
    figs.push(fig);if(figs.length>23) figs.shift();
    save();rebuild();say("Here's your fig. Drag it around, or press Gravity.");
  },30);
}

/* ---------- keys ---------- */
const db=$("darkBtn");
db.addEventListener("click",()=>{
  const on=db.getAttribute("aria-pressed")!=="true";
  document.documentElement.setAttribute("data-theme",on?"dark":"light");db.setAttribute("aria-pressed",String(on));
  dark=on;bodies.forEach(b=>{const m=b.plugin.m;if(!m) return;if(m.plus) paintPlus(m); else paintSprite(m);});
});
const gb=$("gravity");
gb.addEventListener("click",()=>{
  gravityOn=!gravityOn;gb.setAttribute("aria-pressed",String(gravityOn));
  engine.gravity.y=gravityOn?1:0;
  if(gravityOn) bodies.forEach(b=>{b.isSensor=false;Body.setVelocity(b,{x:(Math.random()-.5)*3,y:-1-Math.random()*2});Body.setAngularVelocity(b,(Math.random()-.5)*.08);});
  else bodies.forEach(b=>{b.plugin.t0=performance.now();b.plugin.stuck=0;});
});

let rt;
addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{size();rebuild();},120);});
document.fonts&&document.fonts.ready.then(()=>{}).catch(()=>{});
size();rebuild();bodies.forEach(b=>{b.plugin.born=performance.now();});
requestAnimationFrame(frame);
})();
</script>
